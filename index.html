/* Layout: program-guide grid. Rooms are channels down the left, time runs across the top, a live "now" line cuts through. */
:root{
  --bg:#e9edf4; --surface:#ffffff; --surface2:#f4f6fa; --ink:#121826; --muted:#5a6476; --line:#d3d9e4;
  --accent:#c7820a; --accent-ink:#ffffff; --follow:#c2266f; --now:#e0472f; --focus:#2f6fe0;
  --c-key:#b7791f; --c-brk:#2f6fe0; --c-thr:#0f8a7e; --c-lt:#7b4fd6; --c-tt:#c2416b; --c-lab:#3f8a2c; --c-bc:#d9622b; --c-inv:#0b88b5; --c-oth:#6b7385;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --labelw:112px; --rowh:58px; --headh:30px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --surface:#141b2d; --surface2:#1a2338; --ink:#e6eaf2; --muted:#98a2b6; --line:#263049;
  --accent:#f2b544; --accent-ink:#1a1204; --follow:#ff5fa2; --now:#ff6a4d; --focus:#7aa7ff;
  --c-key:#e0a63c; --c-brk:#6b9bff; --c-thr:#3cc4b4; --c-lt:#a888ff; --c-tt:#f07ba0; --c-lab:#7ccf5f; --c-bc:#ff9257; --c-inv:#4cc3ee; --c-oth:#8e97aa;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --surface:#141b2d; --surface2:#1a2338; --ink:#e6eaf2; --muted:#98a2b6; --line:#263049;
  --accent:#f2b544; --accent-ink:#1a1204; --follow:#ff5fa2; --now:#ff6a4d; --focus:#7aa7ff;
  --c-key:#e0a63c; --c-brk:#6b9bff; --c-thr:#3cc4b4; --c-lt:#a888ff; --c-tt:#f07ba0; --c-lab:#7ccf5f; --c-bc:#ff9257; --c-inv:#4cc3ee; --c-oth:#8e97aa;
  color-scheme:dark}
@media (min-width:760px){:root{--labelw:184px; --rowh:64px}}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Top bar */
header.top{background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;padding-block:10px 8px;flex:none}
.row1{display:flex;align-items:center;gap:8px 10px;min-width:0;flex-wrap:wrap}
@media (max-width:759px){.brand{flex:1 1 100%;min-width:0}.brand small{overflow:hidden;text-overflow:ellipsis}}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:none;margin-top:3px}
.search{flex:1;min-width:0;position:relative}
#q::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input{width:100%;height:36px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:0 32px 0 32px}
.search svg{position:absolute;left:9px;top:10px;color:var(--muted)}
.search button{position:absolute;right:4px;top:4px;width:28px;height:28px;border:0;background:none;color:var(--muted);border-radius:6px;display:grid;place-items:center}
.iconbtn{height:36px;min-width:36px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;position:relative;white-space:nowrap}
.iconbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:10px;font-weight:500;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:6px 10px;border-radius:6px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface2);box-shadow:inset 0 -2px 0 var(--accent)}
.row2{display:flex;align-items:center;gap:8px;min-width:0}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.days::-webkit-scrollbar{display:none}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.1;white-space:nowrap}
.day b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.day span{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.75}
.day.today b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--now);margin-left:5px;vertical-align:middle}
.tools{display:flex;gap:6px;flex:none}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tog[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.tog .sw{width:9px;height:9px;border-radius:2px;flex:none}
.status{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row3{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto}

/* Guide grid */
#grid{overscroll-behavior:contain}
.gin{position:relative}
.ghead{position:sticky;top:0;z-index:4;display:flex;height:var(--headh);background:var(--surface);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:5;width:var(--labelw);flex:none;background:var(--surface);border-right:1px solid var(--line);font-family:var(--f-mono);font-size:10px;color:var(--muted);display:flex;align-items:center;padding:0 8px}
.ticks{position:relative;flex:none}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-family:var(--f-mono);font-size:11px;padding:7px 0 0 5px;white-space:nowrap;color:var(--muted)}
.tick.hr{color:var(--ink);font-weight:500}
.grow{display:flex;border-bottom:1px solid var(--line)}
.grow.bstart{border-top:2px solid var(--line)}
.rlabel{position:sticky;left:0;z-index:3;width:var(--labelw);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.rlabel b{font-weight:600;font-size:12px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rlabel span{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.04em}
.track{position:relative;flex:none;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--hh) - 1px),color-mix(in srgb,var(--line) 55%,transparent) calc(var(--hh) - 1px),color-mix(in srgb,var(--line) 55%,transparent) var(--hh))}
.blk{position:absolute;top:3px;border:0;border-left:4px solid var(--tc);border-radius:5px;background:color-mix(in srgb,var(--tc) 14%,var(--surface));text-align:left;padding:4px 6px 4px 6px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;gap:1px;min-width:0}
.blk:hover{background:color-mix(in srgb,var(--tc) 24%,var(--surface))}
.blk .bt{font-weight:600;font-size:12px;line-height:15px;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.blk .bm,.blk .bs{font-size:10.5px;line-height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bm{font-family:var(--f-mono);font-size:10px}
.tdot{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--tg);flex:none}
.blk .flags .tdot{margin-top:2px}
.blk .flags{position:absolute;top:3px;right:3px;display:flex;gap:2px}
.blk .flags svg{width:12px;height:12px}
.blk.star{box-shadow:inset 0 0 0 2px var(--accent)}
.blk.trk{box-shadow:inset 0 0 0 2px var(--follow)}
.blk.star.trk{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 0 4px var(--follow)}
.blk .bs .f{color:var(--follow);font-weight:600}
.blk.past{opacity:.45}
.blk.live .bm::before{content:"LIVE ";color:var(--now);font-weight:600;font-family:var(--f-mono)}
.fstar{color:var(--accent);fill:var(--accent)}
.ffol{color:var(--follow)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--now);z-index:1;pointer-events:none}
.blk{z-index:2}
.nowtick{position:absolute;top:6px;transform:translateX(-50%);background:var(--now);color:#fff;font-family:var(--f-mono);font-size:10px;padding:1px 4px;border-radius:3px;white-space:nowrap;z-index:1;pointer-events:none}
.t-Keynote{--tc:var(--c-key)} .t-Breakout{--tc:var(--c-brk)} .t-Theater{--tc:var(--c-thr)} .t-Lightning{--tc:var(--c-lt)} .t-Table{--tc:var(--c-tt)} .t-Lab,.t-Digital{--tc:var(--c-lab)} .t-Broadcast{--tc:var(--c-bc)} .t-Innovation{--tc:var(--c-inv)} .t-Pre-recorded,.t-Other{--tc:var(--c-oth)}

.empty{padding:40px 16px;text-align:center;color:var(--muted);max-width:52ch;margin:0 auto}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}

/* Lists */
.list{max-width:860px;margin:0 auto;padding-block:8px 40px;display:flex;flex-direction:column;gap:4px}
.slot{position:sticky;top:0;z-index:2;background:var(--bg);font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;padding:10px 0 4px;display:flex;align-items:baseline;gap:8px}
.slot small{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0;text-transform:none}
.card{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:8px;padding:9px 10px;min-width:0}
.card.star{border-color:var(--accent);border-left-color:var(--tc)}
.card.past{opacity:.55}
.card.live .cm::before{content:"LIVE";color:var(--now);font-weight:600;font-family:var(--f-mono)}
.card .main{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;display:flex;flex-direction:column;gap:2px}
.card .ct{font-weight:600;font-size:14px;line-height:1.3}
.card .cm{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.card .cm .tm{font-family:var(--f-mono);color:var(--ink)}
.card .cs{font-size:12px}
.card .cs .f{color:var(--follow);font-weight:600}
.card .warn{font-size:11.5px;color:var(--now);font-weight:600}
.starbtn{border:0;background:none;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.starbtn svg{width:20px;height:20px}
.starbtn[aria-pressed="true"]{color:var(--accent)}
.starbtn[aria-pressed="true"] svg{fill:var(--accent)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:10.5px;border-radius:4px;padding:1px 5px;background:color-mix(in srgb,var(--tc) 18%,var(--surface));color:var(--ink);white-space:nowrap}
.sec{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:18px 0 6px;display:flex;align-items:baseline;gap:8px}
.sec small{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0}
.hint{color:var(--muted);font-size:12.5px}

/* Speakers */
.spk{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.spk .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.spk .sn{font-weight:600}
.spk .sj{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spk .sc{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.folbtn{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500;white-space:nowrap;flex:none}
.folbtn[aria-pressed="true"]{background:var(--follow);border-color:var(--follow);color:#fff}
.spsearch{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0}
.spsearch input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px}

/* Sheets */
.scrim{position:fixed;inset:0;background:rgb(5 8 16 / .5);z-index:60}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:88%;background:var(--surface);border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgb(0 0 0 / .25)}
@media (min-width:760px){.sheet{left:auto;top:0;bottom:0;width:520px;max-height:none;border-radius:0}}
.shead{display:flex;align-items:flex-start;gap:8px;padding-block:12px 8px;border-bottom:1px solid var(--line)}
.shead h2{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.1;letter-spacing:.01em;margin:0;text-wrap:balance}
.sbody{overflow:auto;padding-block:12px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.kv dd{margin:0;min-width:0}
.desc{white-space:pre-wrap;font-size:14px;line-height:1.55;max-width:65ch}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tagb{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:2px 9px;font-size:12px}
.tagb[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.tagb small{font-family:var(--f-mono);font-size:10px;color:var(--muted);margin-left:3px}
.notes label{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between}
.notes textarea{width:100%;min-height:120px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;resize:vertical;line-height:1.45;margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;font-weight:500;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary svg{fill:var(--accent-ink)}
.spline{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.spline:last-child{border-bottom:0}
.spline .main{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.spline .sj{font-size:12px;color:var(--muted)}
.fgroup h3{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 6px}
.fgroup input{width:100%;height:34px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:0 10px;margin-bottom:6px}
.mtag{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.mtag[aria-pressed="true"]{border-color:var(--tg);background:color-mix(in srgb,var(--tg) 20%,var(--surface))}
.mtag.add{border-style:dashed;color:var(--muted)}
.tchip{display:inline-flex;align-items:center;gap:5px;border:1px solid color-mix(in srgb,var(--tg) 60%,var(--line));background:color-mix(in srgb,var(--tg) 14%,var(--surface));border-radius:999px;padding:2px 4px 2px 9px;font-size:12px}
.tchip small{font-family:var(--f-mono);font-size:9.5px;color:var(--muted)}
.tchip button{border:0;background:none;width:20px;height:20px;border-radius:10px;display:grid;place-items:center;color:var(--muted);padding:0}
.tchip button svg{width:12px;height:12px}
.tagedit{border:1px solid var(--line);border-left:4px solid var(--tg);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface2)}
.tagedit .r{display:flex;gap:6px;align-items:center;min-width:0}
.tagedit input{flex:1;min-width:0;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 8px}
.tagedit .nm{font-weight:600}
.tagedit .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.tagedit .del{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:34px;padding:0 10px;font-size:12px;white-space:nowrap}
.tagedit .del.arm{background:var(--now);border-color:var(--now);color:#fff}
.inline{display:flex;gap:6px;min-width:0}
.inline input{flex:1;min-width:0;height:34px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:0 10px}
.tagpanel{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.tp1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tp1 .inline{flex:1 1 260px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:0 10px;height:34px;font-size:12.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tplist{max-height:88px;overflow-y:auto;padding-right:2px}
@media (max-width:759px){.tplist{max-height:62px}}
.tterm{border-style:dashed}
.tagpanel .hint{font-size:11.5px}
.legend{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.legend::-webkit-scrollbar{display:none}
.legend .lh{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;flex:none}
.lg{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px 3px 4px;font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.lg .sb{width:16px;height:14px;border-radius:3px;border-left:4px solid var(--tc);background:color-mix(in srgb,var(--tc) 22%,var(--surface));flex:none}
.lg small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.lg[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 18%,var(--surface))}
.lk{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
.lk .ob{width:16px;height:14px;border-radius:3px;background:var(--surface2)}
.lsep{width:1px;height:18px;background:var(--line);flex:none}
.grow.pinrow{border-bottom:2px solid var(--accent)}
.grow.pinrow .rlabel{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.grow.pinrow .rlabel b{font-family:var(--f-display);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.grow.pinrow .rlabel span.cf{color:var(--now)}
.slot.pin{color:var(--accent)}
.imp{display:flex;flex-direction:column;gap:8px}
.imp textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;resize:vertical}
.imp input[type=file]{max-width:100%;font-size:13px}
#sharestat:empty,#xferstat:empty{display:none}
#xferstat{white-space:pre-wrap;word-break:break-all}
#sharestat{white-space:pre-wrap;margin-top:-6px}
.impstat{font-size:12.5px;color:var(--muted);min-height:1.2em}
.impstat.err{color:var(--now)}
.irow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.irow input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.irow label{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.irow .ct{font-weight:600}
.irow .cm{font-size:12px;color:var(--muted)}
.miss{font-size:12.5px;color:var(--muted)}
.kb{display:inline-block;font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;line-height:14px;border-radius:3px;padding:0 4px;border:1px dashed var(--kc);color:var(--kc);background:color-mix(in srgb,var(--kc) 12%,var(--surface));white-space:nowrap;flex:none}
.kb-overflow{--kc:var(--muted)} .kb-online{--kc:var(--c-inv)} .kb-ondemand{--kc:var(--c-oth)} .kb-digital{--kc:var(--c-lab)}
.blk .kline{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;margin-bottom:2px;min-height:15px}
.blk.k-overflow{border-left-style:dashed;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--tc) 14%,var(--surface)) 0 7px,var(--surface) 7px 14px)}
.blk.k-online{outline:1.5px dashed var(--c-inv);outline-offset:-2px}
.card.k-overflow{border-left-style:dashed;background:repeating-linear-gradient(135deg,var(--surface) 0 9px,var(--surface2) 9px 18px)}
.card.k-online,.card.k-ondemand,.card.k-digital{border-style:dashed;border-left-style:solid}
.callout{border:1px dashed var(--kc,var(--line));border-left:4px solid var(--kc,var(--line));background:color-mix(in srgb,var(--kc,var(--muted)) 10%,var(--surface));border-radius:8px;padding:9px 11px;font-size:13px;line-height:1.45}
.kc-overflow{--kc:var(--muted)} .kc-online{--kc:var(--c-inv)} .kc-ondemand{--kc:var(--c-oth)} .kc-digital{--kc:var(--c-lab)} .kc-main{--kc:var(--accent)}
.linkbtn{border:0;background:none;padding:0;color:var(--focus);text-decoration:underline;text-align:left;font:inherit;cursor:pointer}
.remcard{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap}
.chk input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.chk select{height:30px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:0 6px}
#toasts{position:fixed;z-index:70;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100% - 24px))}
.toast{background:var(--surface);border:1px solid var(--accent);border-left:5px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:0 8px 30px rgb(0 0 0 / .3);display:flex;flex-direction:column;gap:3px}
.toast .tt{font-family:var(--f-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.toast .tb{font-weight:600;line-height:1.3}
.toast .tm{font-size:12px;color:var(--muted)}
.toast .actions{margin-top:4px}
.kb-cancelled{--kc:var(--now);border-style:solid}
.blk.cx .bt,.card.cx .ct{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.75}
.blk.cx{outline:1.5px solid color-mix(in srgb,var(--now) 70%,transparent);outline-offset:-2px}
.kc-cancelled{--kc:var(--now)}
.toast.warn{border-color:var(--now);border-left-color:var(--now)}
.toast.warn .tt{color:var(--now)}
.card.chg{border-left-color:var(--now)}
.rlabel a.rmap{color:inherit;text-decoration:none;display:flex;flex-direction:column;min-width:0}
.rlabel a.rmap span{display:flex;align-items:center;gap:3px}
.rlabel a.rmap span svg{width:10px;height:10px;flex:none}
.rlabel a.rmap:hover b{text-decoration:underline}
.agday{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.agday.past{opacity:.6}
.agg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.agh{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.agrow{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);min-width:0}
.agh+.agrow{border-top:0}
.agrow.past{opacity:.55}
.agrow.live{box-shadow:inset 3px 0 0 var(--now);padding-left:8px}
.agt{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.agt .live{color:var(--now);font-size:10.5px;display:block}
.agb{min-width:0;display:flex;flex-direction:column;gap:3px}
.agtitle{font-weight:600}
.agtitle small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted);margin-left:4px}
.agplaces,.agchips{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
.agplaces a,.agchips a{color:var(--focus);text-decoration:none;display:inline-flex;align-items:center;gap:3px}
.agplaces a:hover,.agchips a:hover{text-decoration:underline}
.agplaces svg,.agchips svg{width:12px;height:12px;flex:none}
.agchip{white-space:nowrap}
@media (max-width:480px){.agrow{grid-template-columns:78px 1fr}}
code.k{font-family:var(--f-mono);font-size:11.5px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.loading{display:grid;place-items:center;height:100%;color:var(--muted);font-family:var(--f-mono);font-size:12px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top gut">
  <div class="row1">
    <div class="brand">Ignite Guide<small id="evsub">San Francisco, Nov 16-20 2026, Pacific time</small></div>
    <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search titles, speakers, tags, codes" autocomplete="off" aria-label="Search sessions"><button id="qclear" aria-label="Clear search" hidden><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>

  </div>
  <div class="tabs" role="tablist">

    <button class="tab" role="tab" data-v="list">List</button>

      <button class="iconbtn" id="zin" aria-label="Zoom in"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </div>
  <div class="row3" id="quick">
    <button class="tog" id="tTrk" aria-pressed="false"><span class="sw" style="background:var(--follow)"></span>Followed speakers</button>
    <button class="tog" id="tStar" aria-pressed="false"><span class="sw" style="background:var(--accent)"></span>Starred</button>

    <span id="mytagchips" style="display:contents"></span>
    <button class="mtag add" id="tagmgr">+ My tags</button>
    <button class="tog" id="tKey" aria-pressed="true">Color key</button>
    <span class="status" id="status">Loading</span>
  </div>
  <div class="legend" id="legend" aria-label="Color key"></div>
  <div class="tagpanel" id="tagpanel" hidden>
    <div class="tp1">
      <div class="inline"><input id="tagin" type="search" placeholder="Type tags, e.g. github copilot, azure, ai" autocomplete="off" aria-label="Type tags to filter on"><button class="btn" id="tagadd">Add</button></div>

</header>
